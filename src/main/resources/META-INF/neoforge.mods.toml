modLoader = "javafml"
loaderVersion = "${loader_version_range}"
issueTrackerURL = "https://github.com/AppliedEnergistics/Applied-Mekanistics/issues"
license = "See GitHub repository for details"

[[mods]]
modId = "appmek"
version = "${version}"
displayName = "Applied Mekanistics: Version Locked"
description = "Community port for Minecraft 26.1.2: use Mekanism and Mekanism Extras chemicals through AE2. Original project by ramidzkh and AppliedEnergistics."
displayURL = "https://github.com/AppliedEnergistics/Applied-Mekanistics#readme"
logoFile = "logo.png"
authors = "ramidzkh"

[[mixins]]
config = "appmek.mixins.json"

[[dependencies.appmek]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.appmek]]
modId = "ae2"
type = "required"
versionRange = "[26.1.12-beta,27)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.appmek]]
modId = "mekanism"
type = "required"
versionRange = "${mekanism_version_range}"
ordering = "AFTER"
side = "BOTH"
