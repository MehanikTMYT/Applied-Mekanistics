plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.146' }
version = '1.6.0-port1'
group = 'me.ramidzkh'
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge { version = '26.1.2.109'; mods { appmek { sourceSet sourceSets.main } }; runs { client { client() }; server { server(); programArgument '--nogui' } } }
repositories { mavenCentral() }
dependencies {
 implementation files('libs/appliedenergistics2-26.1.12-beta.jar')
 runtimeOnly files('libs/guideme-26.1.12-beta.jar')
 implementation files('libs/Mekanism-Version-Locked-26.1.2-2.7.jar')
 compileOnly files('libs/jei-26.1.2-neoforge-29.37.0.99.jar')
 compileOnly files('libs/Jade-mc26.1-NeoForge-26.1.11.jar')
 compileOnly 'org.jetbrains:annotations:26.0.1'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
sourceSets.main.java { exclude 'me/ramidzkh/mekae2/data/**'; exclude 'me/ramidzkh/mekae2/integration/emi/**' }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.compilerArgs += ['-Xmaxerrs','1000'] }
tasks.named('processResources') { filesMatching('META-INF/neoforge.mods.toml') { expand(version: '1.6.0-port1',loader_version_range:'[4,)',neo_version_range:'[26.1.2.109,)',ae2_version_range:'[26.1.12-beta,27)',mekanism_version_range:'[10.8.0,11)') } }
tasks.named('jar') { archiveFileName='Applied-Mekanistics-Version-Locked-26.1.2-1.6.0-port1.jar'; from('LICENSE') { into 'META-INF' }
 from('THIRD-PARTY-NOTICES.md') { into 'META-INF' } }

if(providers.gradleProperty('portSmoke').isPresent()) {
 dependencies { runtimeOnly files('libs/mekanism_extras-26.1.2-1.4.2-fix5-atm11-0.9.0.jar','libs/MekanismGenerators-Version-Locked-26.1.2-1.3.jar','libs/mekmm-26.1.2-2.0.0-port8-atm11-0.9.0.jar') }
 sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
 neoForge.addModdingDependenciesTo(sourceSets.test)
 neoForge.mods.appmek.sourceSet sourceSets.test
 neoForge.runs.server.systemProperty 'appmek.smoke','true'
}

if(providers.gradleProperty('clientSmoke').isPresent()) {
 dependencies { runtimeOnly files('libs/jei-26.1.2-neoforge-29.37.0.99.jar') }
 neoForge.runs.client.systemProperty 'appmek.clientSmoke','true'
 neoForge.runs.client.programArguments.addAll('--quickPlaySingleplayer','appmek-test')
}
tasks.named('downloadAssets') { javaExecutable.set(javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath }) }

tasks.register('portSources', Jar) {
 archiveFileName='Applied-Mekanistics-Version-Locked-26.1.2-1.6.0-port1-sources.jar'
 destinationDirectory=layout.buildDirectory.dir('libs')
 from('src/main/java')
 from('src/main/resources')
 from('LICENSE') { into 'META-INF' }
 from('THIRD-PARTY-NOTICES.md') { into 'META-INF' }
}
